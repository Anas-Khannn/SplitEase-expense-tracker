services:
  postgres:
    image: postgres:16-alpine
    container_name: splitease-db
    ports:
      - "54320:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: splitease_dev
      POSTGRES_DB: splitease_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
