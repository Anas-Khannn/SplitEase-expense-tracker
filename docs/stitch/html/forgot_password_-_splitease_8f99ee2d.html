<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Reset password • SplitEase</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Geist", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Native tap highlight reset */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-zinc-100 flex items-center justify-center min-h-screen antialiased selection:bg-zinc-200 selection:text-zinc-900 font-body">
<!-- Mobile Viewport Container mimicking native flagship phone -->
<main class="w-full max-w-md h-[884px] bg-white flex flex-col justify-between shadow-2xl relative overflow-hidden border-x border-zinc-200/80">
<!-- Subtle iOS Status Bar representation for authentic mobile framing -->
<div class="w-full h-11 px-6 flex items-center justify-between text-zinc-900 text-xs font-semibold select-none pt-1 shrink-0">
<span class="font-headline tracking-tight">9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[17px] leading-none">battery_full</span>
</div>
</div>
<!-- Top Navigation Bar following Shared Component JSON specification -->
<header class="sticky top-0 z-50 flex items-center justify-between w-full h-14 px-4 bg-white/80 backdrop-blur border-b border-zinc-200 shrink-0">
<button aria-label="Go back" class="w-9 h-9 flex items-center justify-center rounded-lg text-zinc-900 hover:bg-zinc-100 active:scale-95 transition-all duration-150 border border-zinc-200/60" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-xl leading-none">arrow_back</span>
</button>
<!-- Center Brand Identity -->
<div class="flex items-center gap-1.5 select-none">
<div class="w-5 h-5 rounded bg-zinc-900 flex items-center justify-center text-white">
<span class="material-symbols-outlined text-xs leading-none">call_split</span>
</div>
<span class="font-headline text-base font-semibold tracking-tight text-zinc-900">SplitEase</span>
</div>
<!-- Balanced spacer for true optical centering -->
<div aria-hidden="true" class="w-9 h-9 opacity-0 pointer-events-none"></div>
</header>
<!-- Core Scrollable Content Area -->
<div class="flex-1 flex flex-col justify-center px-6 py-6 max-w-sm mx-auto w-full">
<!-- Central Hero Visual & Copy -->
<div class="flex flex-col items-center text-center mb-8">
<!-- Soft Icon Enclosure -->
<div class="w-14 h-14 rounded-full bg-zinc-50 border border-zinc-200/80 flex items-center justify-center shadow-sm mb-5 text-zinc-800">
<span class="material-symbols-outlined text-2xl" data-weight="regular">lock_reset</span>
</div>
<h1 class="font-headline text-2xl font-semibold tracking-tight text-zinc-900">
          Reset password
        </h1>
<p class="text-sm text-zinc-500 max-w-[280px] mx-auto text-center leading-relaxed mt-2">
          Enter your email and we'll send you a link to reset your password.
        </p>
</div>
<!-- Password Reset Form -->
<form class="space-y-4 w-full" id="reset-form" onsubmit="handleReset(event)">
<div>
<label class="text-sm font-medium text-zinc-700 leading-none mb-2 block" for="email">
            Email address
          </label>
<div class="relative">
<input autocomplete="email" class="w-full rounded-lg border border-zinc-200 bg-white px-3.5 py-2.5 text-sm text-zinc-900 shadow-sm focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 focus:outline-none transition-all placeholder:text-zinc-400" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Primary Action Button adhering strictly to shadcn design principles -->
<button class="w-full h-11 rounded-lg bg-zinc-900 text-white font-medium text-sm hover:bg-zinc-800 active:scale-[0.99] transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer mt-2" id="submit-btn" type="submit">
<span>Send reset link</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
<!-- Dynamic inline feedback message container -->
<div class="hidden p-3 rounded-lg border text-xs text-center transition-all" id="status-message"></div>
</form>
<!-- Reassurance Banner -->
<div class="mt-8 pt-6 border-t border-zinc-100 flex items-center justify-center gap-2 text-zinc-400">
<span class="material-symbols-outlined text-sm">encrypted</span>
<span class="text-xs">Secured with end-to-end encryption</span>
</div>
</div>
<!-- Footer & Mobile Interaction Region -->
<div class="pb-2 pt-2 px-6 flex flex-col items-center gap-6 shrink-0 bg-white">
<div class="text-center">
<p class="text-sm text-zinc-500">
          Remembered it? 
          <a class="font-medium text-zinc-900 underline underline-offset-4 decoration-zinc-300 hover:decoration-zinc-900 transition-colors ml-1" href="#login">
            Back to login
          </a>
</p>
</div>
<!-- iOS Home Indicator Pill -->
<div class="w-32 h-1 bg-zinc-300/80 rounded-full mb-1"></div>
</div>
</main>
<script>
    function handleReset(event) {
      event.preventDefault();
      const btn = document.getElementById('submit-btn');
      const emailInput = document.getElementById('email');
      const statusDiv = document.getElementById('status-message');

      if (!emailInput.value) return;

      // Loading state
      btn.disabled = true;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      btn.innerHTML = `
        <span class="material-symbols-outlined text-base animate-spin">progress_activity</span>
        <span>Sending instructions...</span>
      `;

      // Simulated smooth asynchronous submission
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
        btn.innerHTML = `
          <span>Link sent</span>
          <span class="material-symbols-outlined text-base">check</span>
        `;
        btn.classList.replace('bg-zinc-900', 'bg-zinc-800');

        // Display feedback banner
        statusDiv.className = "p-3 rounded-lg border border-emerald-200 bg-emerald-50/50 text-emerald-800 text-xs text-center flex items-center justify-center gap-1.5 transition-all";
        statusDiv.innerHTML = `
          <span class="material-symbols-outlined text-sm text-emerald-600">check_circle</span>
          <span>Reset link sent to <strong>${emailInput.value}</strong></span>
        `;
      }, 750);
    }
  </script>
</body></html>
