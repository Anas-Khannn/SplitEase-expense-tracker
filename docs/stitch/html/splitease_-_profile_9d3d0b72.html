<!-- Interactive micro-interaction script for shadcn switch -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('theme-toggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          const isChecked = toggle.getAttribute('aria-checked') === 'true';
          toggle.setAttribute('aria-checked', !isChecked);
          const thumb = toggle.querySelector('span');
          if (!isChecked) {
            toggle.classList.remove('bg-zinc-200');
            toggle.classList.add('bg-zinc-900');
            thumb.classList.remove('translate-x-0.5');
            thumb.classList.add('translate-x-[22px]');
          } else {
            toggle.classList.remove('bg-zinc-900');
            toggle.classList.add('bg-zinc-200');
            thumb.classList.remove('translate-x-[22px]');
            thumb.classList.add('translate-x-0.5');
          }
        });
      }
    });
  </script>
